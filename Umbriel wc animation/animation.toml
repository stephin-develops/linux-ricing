[animation.beziers]
appleEase = [0.25, 1.0, 0.5, 1.0]

[animation.springs]
appleSpring = { damping = 1.0, stiffness = 256 }

[animation]
duration_ms = 350
curve = "appleEase"

[animation.windows_in]
enabled = true
duration_ms = 350
curve = "appleEase"
style = "zoom"
scale = 0.9

[animation.windows_out]
enabled = true
duration_ms = 250
curve = "appleEase"
style = "popin"

[animation.windows_move]
enabled = true
curve = "appleSpring"

[animation.workspaces]
enabled = true
curve = "appleSpring"

[animation.overview]
enabled = true
duration_ms = 400
curve = "appleEase"

[animation.scratchpad]
enabled = true
curve = "appleSpring"
dim = 0.3
blur = true

[animation.border]
enabled = true
duration_ms = 200
curve = "linear"

[animation.dim_unfocused]
enabled = false
duration_ms = 300
curve = "appleEase"
dim = 0.0

[animation.layers]
enabled = true
duration_ms = 250
curve = "appleEase"
